kind = "mobile"
previewPath = "/relateiq-production-build/"
title = "ConnectIQ"
version = "1.0.0"
id = "artifacts/connectiq"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/relateiq-production-build/" ]
localPort = 26184

[services.development]
run = "pnpm --filter @workspace/relateiq-production-build run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/relateiq-production-build", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/relateiq-production-build", "run", "serve" ]

[services.env]
PORT = "26184"
BASE_PATH = "/relateiq-production-build/"